<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerodha Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #131722; color: #d1d4dc; min-height: 100vh; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #1e222d; border-bottom: 1px solid #2a2e39; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 18px; color: #fff; }
  .header .user { display: flex; align-items: center; gap: 8px; color: #787b86; font-size: 14px; }
  .header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* Login */
  .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; padding: 24px; }
  .login-container .icon { font-size: 64px; margin-bottom: 16px; }
  .login-container h2 { font-size: 28px; color: #fff; margin-bottom: 12px; }
  .login-container p { color: #787b86; max-width: 320px; line-height: 1.6; margin-bottom: 32px; }
  .login-btn { background: #2962ff; color: #fff; border: none; padding: 14px 40px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .login-btn:hover { background: #1e53e5; }

  /* Dashboard */
  .dashboard { padding: 12px; display: grid; gap: 12px; max-width: 1200px; margin: 0 auto; }
  @media (min-width: 768px) { .dashboard { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1024px) { .dashboard { grid-template-columns: 1fr 1fr 1fr; } }

  /* Cards */
  .card { background: #1e222d; border: 1px solid #2a2e39; border-radius: 12px; padding: 16px; }
  .card-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 12px; }
  .card-full { grid-column: 1 / -1; }

  /* Watchlist */
  .wl-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2e39; }
  .wl-row:last-child { border-bottom: none; }
  .wl-symbol { font-size: 14px; font-weight: 500; }
  .wl-price { font-size: 14px; color: #fff; font-weight: 600; }
  .wl-change { font-size: 12px; margin-left: 8px; }

  /* Stats row */
  .stats-row { display: flex; justify-content: space-between; }
  .stat { text-align: center; flex: 1; }
  .stat-label { font-size: 12px; color: #787b86; margin-bottom: 4px; }
  .stat-value { font-size: 14px; color: #fff; font-weight: 600; }

  /* Table rows */
  .trow { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2e39; }
  .trow:last-child { border-bottom: none; }
  .trow-symbol { font-size: 14px; font-weight: 500; }
  .trow-detail { font-size: 12px; color: #787b86; margin-top: 2px; }
  .trow-right { text-align: right; }
  .trow-ltp { font-size: 14px; color: #fff; font-weight: 600; }
  .trow-pnl { font-size: 12px; margin-top: 2px; }

  /* Summary */
  .summary { display: flex; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #2a2e39; font-size: 13px; }
  .summary-label { color: #787b86; }

  /* Orders */
  .order-type { font-size: 12px; font-weight: 700; margin-right: 6px; }
  .order-status { font-size: 12px; font-weight: 600; }

  /* Colors */
  .green { color: #4caf50; }
  .red { color: #f44336; }
  .gray { color: #787b86; }
  .blue { color: #2196f3; }
  .yellow { color: #ffeb3b; }

  /* Loading */
  .loading { text-align: center; padding: 20px; color: #787b86; }
  .skeleton { height: 16px; background: #2a2e39; border-radius: 4px; margin: 8px 0; animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
  .error { color: #f44336; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <h1>Zerodha Dashboard</h1>
  <div class="user">
    <div class="dot"></div>
    <span id="user-name">Loading...</span>
  </div>
</div>

<div id="login-view" class="login-container" style="display:none;">
  <div class="icon">📈</div>
  <h2>Zerodha Dashboard</h2>
  <p>Connect your Kite account to view your portfolio, positions, orders, and live market data.</p>
  <button class="login-btn" onclick="doLogin()">Login with Kite</button>
</div>

<div id="dashboard-view" class="dashboard" style="display:none;">
  <div class="card" id="watchlist-card">
    <div class="card-title">Watchlist</div>
    <div id="watchlist-body"><div class="loading">Loading...</div></div>
  </div>

  <div class="card" id="margins-card">
    <div class="card-title">Margins</div>
    <div id="margins-body"><div class="loading">Loading...</div></div>
  </div>

  <div class="card card-full" id="holdings-card">
    <div class="card-title">Holdings</div>
    <div id="holdings-body"><div class="loading">Loading...</div></div>
  </div>

  <div class="card card-full" id="positions-card">
    <div class="card-title">Positions</div>
    <div id="positions-body"><div class="loading">Loading...</div></div>
  </div>

  <div class="card card-full" id="orders-card">
    <div class="card-title">Orders</div>
    <div id="orders-body"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
const API = "http://localhost:8000";
const INSTRUMENTS = "NSE:NIFTY 50,NSE:NIFTY BANK,NSE:RELIANCE,NSE:TCS,NSE:INFY,NSE:HDFCBANK,NSE:ICICIBANK,NSE:SBIN";

// --- Helpers ---
function fmt(v) { return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",minimumFractionDigits:2}).format(v); }
function fmtNum(v,d=2) { return new Intl.NumberFormat("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v); }
function fmtPct(v) { return (v>=0?"+":"")+v.toFixed(2)+"%"; }
function pnlCls(v) { return v>0?"green":v<0?"red":"gray"; }

async function apiFetch(path) {
  const r = await fetch(API+path, {credentials:"include"});
  if (!r.ok) throw new Error("API "+r.status);
  return r.json();
}

// --- Auth ---
async function checkAuth() {
  try {
    const d = await apiFetch("/api/auth/status");
    if (d.authenticated) { showDashboard(); return true; }
  } catch(e) {}
  showLogin();
  return false;
}

function showLogin() {
  document.getElementById("login-view").style.display = "flex";
  document.getElementById("dashboard-view").style.display = "none";
}

function showDashboard() {
  document.getElementById("login-view").style.display = "none";
  document.getElementById("dashboard-view").style.display = "grid";
  loadAll();
}

async function doLogin() {
  try {
    const d = await apiFetch("/api/login");
    if (d.login_url) window.location.href = d.login_url;
  } catch(e) { alert("Login failed: "+e.message); }
}

// --- Profile ---
async function loadProfile() {
  try {
    const p = await apiFetch("/api/profile");
    document.getElementById("user-name").textContent = p.user_name || p.user_id || "User";
  } catch(e) { document.getElementById("user-name").textContent = "User"; }
}

// --- Watchlist ---
async function loadWatchlist() {
  const el = document.getElementById("watchlist-body");
  try {
    const data = await apiFetch("/api/quote?instruments="+encodeURIComponent(INSTRUMENTS));
    let html = "";
    for (const [symbol, q] of Object.entries(data)) {
      const change = q.ohlc?.close > 0 ? ((q.last_price - q.ohlc.close) / q.ohlc.close) * 100 : 0;
      const name = symbol.split(":")[1] || symbol;
      html += `<div class="wl-row">
        <span class="wl-symbol">${name}</span>
        <div><span class="wl-price">${fmtNum(q.last_price)}</span><span class="wl-change ${pnlCls(change)}">${fmtPct(change)}</span></div>
      </div>`;
    }
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="error">Failed to load quotes</div>'; }
}

// --- Margins ---
async function loadMargins() {
  const el = document.getElementById("margins-body");
  try {
    const data = await apiFetch("/api/margins");
    const eq = data.equity;
    const avail = eq?.available?.live_balance ?? 0;
    const used = eq?.utilised?.debits ?? 0;
    const opening = eq?.available?.opening_balance ?? 0;
    el.innerHTML = `<div class="stats-row">
      <div class="stat"><div class="stat-label">Available</div><div class="stat-value">${fmt(avail)}</div></div>
      <div class="stat"><div class="stat-label">Used</div><div class="stat-value">${fmt(used)}</div></div>
      <div class="stat"><div class="stat-label">Opening</div><div class="stat-value">${fmt(opening)}</div></div>
    </div>`;
  } catch(e) { el.innerHTML = '<div class="error">Failed to load margins</div>'; }
}

// --- Holdings ---
async function loadHoldings() {
  const el = document.getElementById("holdings-body");
  try {
    const holdings = await apiFetch("/api/holdings");
    if (!holdings || holdings.length === 0) { el.innerHTML = '<div class="gray">No holdings found</div>'; return; }

    const totalInv = holdings.reduce((s,h) => s + h.average_price * h.quantity, 0);
    const totalCur = holdings.reduce((s,h) => s + h.last_price * h.quantity, 0);
    const totalPnl = totalCur - totalInv;
    const totalPct = totalInv > 0 ? (totalPnl/totalInv)*100 : 0;

    let html = `<div class="summary">
      <span class="summary-label">Invested: ${fmt(totalInv)}</span>
      <span class="${pnlCls(totalPnl)}">P&L: ${fmt(totalPnl)} (${fmtPct(totalPct)})</span>
    </div>`;

    for (const h of holdings) {
      const pnl = (h.last_price - h.average_price) * h.quantity;
      const pct = h.average_price > 0 ? ((h.last_price - h.average_price)/h.average_price)*100 : 0;
      html += `<div class="trow">
        <div><div class="trow-symbol">${h.tradingsymbol}</div><div class="trow-detail">${h.quantity} x ${fmt(h.average_price)}</div></div>
        <div class="trow-right"><div class="trow-ltp">${fmt(h.last_price)}</div><div class="trow-pnl ${pnlCls(pnl)}">${fmt(pnl)} (${fmtPct(pct)})</div></div>
      </div>`;
    }
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="error">Failed to load holdings</div>'; }
}

// --- Positions ---
async function loadPositions() {
  const el = document.getElementById("positions-body");
  try {
    const data = await apiFetch("/api/positions");
    const positions = data.net || [];
    if (positions.length === 0) { el.innerHTML = '<div class="gray">No open positions</div>'; return; }

    const totalPnl = positions.reduce((s,p) => s + (p.pnl||0), 0);
    let html = `<div class="summary">
      <span class="summary-label">Day P&L</span>
      <span class="${pnlCls(totalPnl)}">${fmt(totalPnl)}</span>
    </div>`;

    for (const p of positions) {
      html += `<div class="trow">
        <div><div class="trow-symbol">${p.tradingsymbol}</div><div class="trow-detail">Qty: ${p.quantity} | Avg: ${fmt(p.average_price)}</div></div>
        <div class="trow-right"><div class="trow-ltp">${fmt(p.last_price)}</div><div class="trow-pnl ${pnlCls(p.pnl||0)}">${fmt(p.pnl||0)}</div></div>
      </div>`;
    }
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="error">Failed to load positions</div>'; }
}

// --- Orders ---
async function loadOrders() {
  const el = document.getElementById("orders-body");
  try {
    const orders = await apiFetch("/api/orders");
    const recent = (orders||[]).slice(0, 20);
    if (recent.length === 0) { el.innerHTML = '<div class="gray">No orders today</div>'; return; }

    const statusCls = {COMPLETE:"green",REJECTED:"red",CANCELLED:"gray",OPEN:"blue",PENDING:"yellow"};
    let html = "";
    for (const o of recent) {
      const time = o.order_timestamp ? new Date(o.order_timestamp).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}) : "--:--";
      const cls = statusCls[o.status] || "gray";
      const buyCls = o.transaction_type === "BUY" ? "green" : "red";
      html += `<div class="trow">
        <div>
          <div><span class="order-type ${buyCls}">${o.transaction_type}</span><span class="trow-symbol">${o.tradingsymbol}</span></div>
          <div class="trow-detail">${time} | Qty: ${o.quantity} | ${fmt(o.price || o.average_price || 0)}</div>
        </div>
        <div class="trow-right"><span class="order-status ${cls}">${o.status}</span></div>
      </div>`;
    }
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<div class="error">Failed to load orders</div>'; }
}

// --- Auto-refresh ---
function loadAll() {
  loadProfile();
  loadWatchlist();
  loadMargins();
  loadHoldings();
  loadPositions();
  loadOrders();
}

async function init() {
  const authed = await checkAuth();
  if (!authed) return;

  setInterval(loadWatchlist, 5000);
  setInterval(loadPositions, 10000);
  setInterval(loadOrders, 15000);
  setInterval(loadMargins, 30000);
  setInterval(loadHoldings, 30000);
}

// Check for auth callback
if (window.location.search.includes("auth=success")) {
  history.replaceState(null, "", window.location.pathname);
}

init();
</script>
</body>
</html>
